<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go htop Web UI</title>
    <style>
        body {
            font-family: monospace;
            background-color: #1e1e2e;
            color: #cdd6f4;
            padding: 20px;
        }
        h1 {
            color: #89b4fa;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #181825;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #313244;
        }
        th {
            background-color: #313244;
            color: #a6e3a1;
        }
        tr:hover {
            background-color: #45475a;
        }
        .btn-kill {
            background-color: #f38ba8;
            color: #11111b;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        .btn-kill:hover {
            background-color: #eb6f92;
        }
    </style>
</head>
<body>

    <h1>Linux Process Manager (Go-htop)</h1>
    <button onclick="loadProcesses()" style="padding: 8px 15px; cursor: pointer;">Aktualisieren</button>

    <table>
        <thead>
            <tr>
                <th>PID</th>
                <th>Name</th>
                <th>CPU (%)</th>
                <th>RAM (%)</th>
                <th>Aktion</th>
            </tr>
        </thead>
        <tbody id="process-table">
            <tr>
                <td colspan="5">Lade Prozesse...</td>
            </tr>
        </tbody>
    </table>

    <script>
        // Funktion holt die Prozesse vom Go-Backend
        async function loadProcesses() {
            try {
                const response = await fetch('/api/processes');
                const processes = await response.json();
                
                const tableBody = document.getElementById('process-table');
                tableBody.innerHTML = '';

                processes.forEach(proc => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${proc.pid}</td>
                        <td>${proc.name}</td>
                        <td>${proc.cpu.toFixed(2)} %</td>
                        <td>${proc.memory.toFixed(2)} %</td>
                        <td>
                            <button class="btn-kill" onclick="killProcess(${proc.pid})">Kill</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error("Fehler beim Laden:", err);
            }
        }

        // Funktion sendet ein Kill-Signal an das Go-Backend
        async function killProcess(pid) {
            if (!confirm(`Möchtest du Prozess ${pid} wirklich beenden?`)) return;

            const response = await fetch('/api/kill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pid: pid })
            });

            if (response.ok) {
                alert(`Prozess ${pid} beendet!`);
                loadProcesses(); // Tabelle neu laden
            } else {
                alert(`Fehler beim Beenden von Prozess ${pid}`);
            }
        }

        // Prozesse sofort beim Laden der Seite abfragen
        loadProcesses();
        
        // Alle 3 Sekunden automatisch aktualisieren
        setInterval(loadProcesses, 3000);
    </script>
</body>
</html>
